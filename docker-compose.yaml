version: "3.8"

services:
  content-db:
    image: postgres:16-alpine
    container_name: content-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    networks:
      - internal


  content-migrate:
    image: migrate/migrate:latest
    depends_on:
      - content-db
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: >
      sh -c '
        apk add --no-cache postgresql-client >/dev/null 2>&1 &&
        echo Waiting for content-db… &&
        until pg_isready -h content-db -U postgres; do sleep 1; done &&
        echo DB is up — запускаем миграции &&
        exec migrate -path /migrations \
             -database "postgres://postgres:password@content-db:5432/postgres?sslmode=disable" up
      '
    networks:
      - internal


  content-service:
    
    image: registry.poshagator.ru/content-service:${IMAGE_TAG:-latest}
    container_name: content-service
    depends_on:
      - content-migrate
    volumes:
      - ./config/config.yaml:/etc/content-service/config.yaml:ro
      - ./migrations:/migrations:ro
    networks:
      - internal
      - traefik_proxy
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.content.rule=Host(`api.poshagator.ru`) && (Path(`/content`) || PathPrefix(`/content/`))"
      - "traefik.http.routers.content.entrypoints=websecure"
      - "traefik.http.routers.content.tls.certresolver=myresolver"
      - "traefik.http.routers.content.middlewares=cors@file,api-auth@file"
      - "traefik.http.services.content.loadbalancer.server.port=3000"

      - "traefik.http.routers.content-options.rule=Host(`api.poshagator.ru`) && PathPrefix(`/content`) && Method(`OPTIONS`)"
      - "traefik.http.routers.content-options.entrypoints=websecure"
      - "traefik.http.routers.content-options.priority=1000"
      - "traefik.http.routers.content-options.middlewares=cors@file"
      - "traefik.http.routers.content-options.service=noop@internal"

      - "traefik.http.routers.content-grpc.rule=Host(`content.grpc.poshagator.ru`)"
      - "traefik.http.routers.content-grpc.entrypoints=websecure"
      - "traefik.http.routers.content-grpc.tls.certresolver=myresolver"
      - "traefik.http.routers.content-grpc.service=content-grpc"
      - "traefik.http.services.content-grpc.loadbalancer.server.port=50051"
      - "traefik.http.services.content-grpc.loadbalancer.server.scheme=h2c"

networks:
  traefik_proxy:
    external: true
  internal:
    external: true
